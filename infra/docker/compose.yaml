name: iconsync

services:
  iconsync:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: runtime
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    working_dir: /workspace
    environment:
      FIGMA_ACCESS_TOKEN: '${FIGMA_ACCESS_TOKEN:-}'
    volumes:
      - ../..:/workspace
